<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,90 5,90' fill='%23ef4444' stroke='%23fff' stroke-width='4'/><text x='50' y='78' text-anchor='middle' font-size='50' font-weight='bold' fill='white'>!</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2235;
      --bg-hover: #1e293b;
      --border: #1e293b;
      --border-subtle: #162032;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --text-table: #e2e8f0;
      --accent-blue: #3b82f6;
      --accent-blue-dim: #1e3a5f;
      --accent-green: #22c55e;
      --accent-green-dim: rgba(34,197,94,0.15);
      --accent-red: #ef4444;
      --accent-red-dim: rgba(239,68,68,0.15);
      --accent-yellow: #eab308;
      --accent-yellow-dim: rgba(234,179,8,0.15);
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }
    body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    .spin { animation: spin 1s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
    .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; backdrop-filter: blur(12px); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { color: var(--accent-blue); display: flex; align-items: center; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .header-user { font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: all 0.15s ease; }
    .btn-icon { width: 34px; height: 34px; padding: 0; background: transparent; color: var(--text-muted); border-radius: 8px; }
    .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn-primary { background: var(--accent-blue); color: white; padding: 8px 16px; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: var(--bg-tertiary); color: var(--text-muted); cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 12px; border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }
    .btn-ghost.active { border-color: var(--accent-blue); color: var(--accent-blue); background: var(--accent-blue-dim); }
    .btn-deploy { background: var(--accent-green-dim); color: var(--accent-green); padding: 4px 10px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); }
    .btn-deploy:hover { background: rgba(34,197,94,0.25); }
    .btn-deploy:disabled { opacity: 0.5; cursor: not-allowed; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s ease; margin-bottom: -1px; }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
    .tab-count { background: var(--bg-tertiary); padding: 1px 7px; border-radius: 10px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
    .tab.active .tab-count { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--bg-secondary); }
    th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); white-space: nowrap; user-select: none; }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--text-secondary); }
    th .sort-icon { display: inline-flex; margin-left: 4px; vertical-align: middle; opacity: 0.4; }
    th.sorted .sort-icon { opacity: 1; color: var(--accent-blue); }
    td { padding: 10px 14px; font-size: 13px; border-top: 1px solid var(--border-subtle); white-space: nowrap; color: var(--text-table); }
    tr:hover td { background: var(--bg-hover); }
    a { color: var(--accent-blue); text-decoration: none; }
    a:hover { color: #60a5fa; }
    .link-muted { color: var(--text-muted); }
    .link-muted:hover { color: var(--accent-blue); }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: var(--accent-green); box-shadow: 0 0 6px rgba(34,197,94,0.4); }
    .dot-red { background: var(--accent-red); box-shadow: 0 0 6px rgba(239,68,68,0.4); }
    .dot-yellow { background: var(--accent-yellow); box-shadow: 0 0 6px rgba(234,179,8,0.4); }
    .dot-gray { background: var(--text-muted); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); }
    .badge-private { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-public { background: var(--accent-red-dim); color: var(--accent-red); }
    .badge-lang { background: var(--bg-tertiary); color: var(--text-secondary); }
    .warn-triangle { display: inline-flex; color: var(--accent-red); filter: drop-shadow(0 0 4px rgba(239,68,68,0.4)); }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 60%), var(--bg-primary); }
    .login-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .login-card .hint { font-size: 12px; color: var(--text-muted); margin-top: 12px; }
    .login-card code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; }
    .input { width: 100%; padding: 10px 14px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: var(--font-mono); font-size: 13px; outline: none; margin-top: 16px; transition: border-color 0.15s; }
    .input:focus { border-color: var(--accent-blue); }
    .input::placeholder { color: var(--text-muted); }
    .error-msg { color: var(--accent-red); font-size: 13px; margin-top: 8px; }
    .group-header { display: flex; align-items: center; gap: 8px; padding: 8px 0; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
    .group-header:hover { color: var(--text-primary); }
    .group-count { color: var(--text-muted); font-weight: 400; font-size: 12px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(4px); }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 520px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .modal-list { overflow-y: auto; flex: 1; }
    .modal-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; background: var(--bg-tertiary); }
    .modal-row span { font-size: 13px; color: var(--text-secondary); }
    .modal-select { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; color: var(--text-primary); font-size: 12px; outline: none; }
    .modal-input { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal-input input { flex: 1; padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 13px; outline: none; }
    .loader-wrap { display: flex; align-items: center; justify-content: center; padding: 80px 0; gap: 12px; }
    .loader-wrap span { color: var(--text-muted); font-size: 14px; }
    .footer { padding: 32px 0; text-align: center; font-size: 12px; color: var(--text-muted); }
    .overflow-x { overflow-x: auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .deploy-link { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); }
    .deploy-link:hover { color: var(--accent-blue); }
    @media (max-width: 768px) { .header-user { display: none; } td, th { padding: 8px 10px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const GITHUB_API = "https://api.github.com";
    const STORAGE_KEY = "gh-dash-token";
    const GROUPS_KEY = "gh-dash-groups";
    const EXPIRY_DAYS = 90;

    // SVG Icon component
    const SvgIcon = ({ paths, size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={{flexShrink:0}}>
        {paths.map((d, i) => <path key={i} d={d} />)}
      </svg>
    );
    // Warning triangle with fill
    const WarnTriangle = ({ size = 16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" className="warn-triangle">
        <path d="M12 2L1 21h22L12 2z" fill="#ef4444" stroke="#fca5a5" strokeWidth="1.5"/>
        <text x="12" y="18" textAnchor="middle" fontSize="11" fontWeight="bold" fill="white" stroke="none">!</text>
      </svg>
    );
    const LockIcon = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const I = {
      gitBranch: (p) => <SvgIcon {...p} paths={["M6 3v12","M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M18 9a9 9 0 0 1-9 9"]} />,
      play: (p) => <SvgIcon {...p} paths={["M5 3l14 9-14 9V3z"]} />,
      extLink: (p) => <SvgIcon {...p} paths={["M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6","M15 3h6v6","M10 14L21 3"]} />,
      arrowUp: (p) => <SvgIcon {...p} paths={["M12 19V5","M5 12l7-7 7 7"]} />,
      arrowDown: (p) => <SvgIcon {...p} paths={["M12 5v14","M19 12l-7 7-7-7"]} />,
      arrowUpDown: (p) => <SvgIcon {...p} paths={["M7 15l5 5 5-5","M7 9l5-5 5 5"]} />,
      loader: (p) => <SvgIcon {...p} paths={["M21 12a9 9 0 1 1-6.219-8.56"]} />,
      logout: (p) => <SvgIcon {...p} paths={["M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4","M16 17l5-5-5-5","M21 12H9"]} />,
      refresh: (p) => <SvgIcon {...p} paths={["M23 4v6h-6","M1 20v-6h6","M3.51 9a9 9 0 0 1 14.85-3.36L23 10","M1 14l4.64 4.36A9 9 0 0 0 20.49 15"]} />,
      settings: (p) => <SvgIcon {...p} paths={["M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z","M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"]} />,
      x: (p) => <SvgIcon {...p} paths={["M18 6L6 18","M6 6l12 12"]} />,
      chevDown: (p) => <SvgIcon {...p} paths={["M6 9l6 6 6-6"]} />,
      chevRight: (p) => <SvgIcon {...p} paths={["M9 18l6-6-6-6"]} />,
      file: (p) => <SvgIcon {...p} paths={["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M14 2v6h6","M16 13H8","M16 17H8"]} />,
      clock: (p) => <SvgIcon {...p} paths={["M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z","M12 6v6l4 2"]} />,
      list: (p) => <SvgIcon {...p} paths={["M8 6h13","M8 12h13","M8 18h13","M3 6h.01","M3 12h.01","M3 18h.01"]} />,
    };

    // Storage
    function loadToken() { try { const r = localStorage.getItem(STORAGE_KEY); if (r) { const d = JSON.parse(r); if (Date.now() < d.expiry) return d.token; } } catch {} return null; }
    function saveToken(t) { localStorage.setItem(STORAGE_KEY, JSON.stringify({ token: t, expiry: Date.now() + EXPIRY_DAYS*86400000 })); }
    function clearToken() { localStorage.removeItem(STORAGE_KEY); }
    function loadGroups() { try { return JSON.parse(localStorage.getItem(GROUPS_KEY)) || {}; } catch { return {}; } }
    function saveGroupsLS(g) { localStorage.setItem(GROUPS_KEY, JSON.stringify(g)); }

    // GitHub API
    async function ghFetch(path, token, opts = {}) {
      const r = await fetch(`${GITHUB_API}${path}`, { ...opts, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...opts.headers } });
      if (!r.ok) throw new Error(`${r.status}`);
      return opts.method === "POST" && r.status === 204 ? null : r.json();
    }
    async function fetchAllRepos(token) {
      let page = 1, all = [];
      while (true) { const r = await ghFetch(`/user/repos?per_page=100&sort=updated&page=${page}`, token); all.push(...r); if (r.length < 100) break; page++; }
      return all;
    }
    async function fetchWorkflows(o, r, t) { try { return (await ghFetch(`/repos/${o}/${r}/actions/workflows`, t)).workflows || []; } catch { return []; } }
    async function fetchRuns(o, r, t, n = 5) { try { return (await ghFetch(`/repos/${o}/${r}/actions/runs?per_page=${n}`, t)).workflow_runs || []; } catch { return []; } }
    async function triggerWorkflow(o, r, wid, t) {
      await ghFetch(`/repos/${o}/${r}/actions/workflows/${wid}/dispatches`, t, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ref: "main" }) });
    }

    // Helpers
    function timeAgo(d) {
      const m = Math.floor((Date.now() - new Date(d).getTime()) / 60000);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h`;
      const days = Math.floor(h / 24);
      if (days < 30) return `${days}d`;
      return new Date(d).toLocaleDateString("de-DE");
    }
    function fmtDate(d) { return new Date(d).toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }); }
    function fmtDuration(s, e) {
      if (!s || !e) return "—";
      const sec = Math.round((new Date(e) - new Date(s)) / 1000);
      return sec < 60 ? `${sec}s` : `${Math.floor(sec/60)}m ${sec%60}s`;
    }

    // Detect languages including YML
    function getLanguages(repo, details) {
      const langs = [];
      if (repo.language) langs.push(repo.language);
      // Check if repo has workflow files -> YML
      const d = details[repo.name];
      if (d && d.workflows && d.workflows.length > 0) {
        if (!langs.includes("YML")) langs.push("YML");
      }
      return langs;
    }

    function StatusDot({ status, conclusion }) {
      if (status === "in_progress" || status === "queued") return <span className="dot dot-yellow pulse"></span>;
      if (conclusion === "success") return <span className="dot dot-green"></span>;
      if (conclusion === "failure") return <span className="dot dot-red"></span>;
      return <span className="dot dot-gray"></span>;
    }

    function SortHeader({ label, field, config, onSort }) {
      const active = config.field === field;
      const cls = `sortable ${active ? "sorted" : ""}`;
      const IconComp = active ? (config.dir === "asc" ? I.arrowUp : I.arrowDown) : I.arrowUpDown;
      return (
        <th className={cls} onClick={() => onSort(field)}>
          {label}<span className="sort-icon"><IconComp size={11} /></span>
        </th>
      );
    }

    // Login
    function LoginScreen({ onLogin, error }) {
      const [token, setToken] = useState("");
      const [loading, setLoading] = useState(false);
      const submit = async () => {
        setLoading(true);
        try { const u = await ghFetch("/user", token); saveToken(token); onLogin(token, u); }
        catch { onLogin(null, null, "Token ungültig oder fehlende Berechtigung."); }
        setLoading(false);
      };
      return (
        <div className="login-wrap">
          <div className="login-card fade-in">
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <I.gitBranch size={26} />
              <h1>GitHub Dashboard</h1>
            </div>
            <p>Personal Access Token eingeben.<br/>Wird für {EXPIRY_DAYS} Tage gespeichert.</p>
            <div className="hint">
              Token erstellen: <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com/settings/tokens</a><br/>
              Permissions: <code>Actions</code> <code>Contents</code> <code>Workflows</code> (Read &amp; Write)
            </div>
            <input className="input" type="password" placeholder="github_pat_xxxxxxxxxxxx" value={token}
              onChange={e => setToken(e.target.value)} onKeyDown={e => e.key === "Enter" && token && submit()} />
            {error && <div className="error-msg">{error}</div>}
            <button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={submit} disabled={!token || loading}>
              {loading && <I.loader size={14} className="spin" />} Anmelden
            </button>
          </div>
        </div>
      );
    }

    // Group Modal
    function GroupModal({ repos, groups, onSave, onClose }) {
      const [local, setLocal] = useState({...groups});
      const [newG, setNewG] = useState("");
      const names = [...new Set(Object.values(local).filter(Boolean))].sort();
      const allNames = newG.trim() ? [...names, newG.trim()] : names;
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal fade-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <h2>Repo-Gruppen zuordnen</h2>
              <button className="btn btn-icon" onClick={onClose}><I.x size={18} /></button>
            </div>
            <div className="modal-input">
              <input placeholder="Neue Gruppe eingeben..." value={newG} onChange={e => setNewG(e.target.value)} />
            </div>
            <div className="modal-list">
              {repos.map(r => (
                <div className="modal-row" key={r.name}>
                  <span>{r.name}</span>
                  <select className="modal-select" value={local[r.name]||""} onChange={e => setLocal({...local, [r.name]: e.target.value})}>
                    <option value="">— Keine Gruppe —</option>
                    {allNames.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
              ))}
            </div>
            <button className="btn btn-primary" style={{width:"100%",marginTop:16}} onClick={() => { onSave(local); onClose(); }}>Speichern</button>
          </div>
        </div>
      );
    }

    // Main
    function Dashboard() {
      const [token, setToken] = useState(null);
      const [user, setUser] = useState(null);
      const [loginErr, setLoginErr] = useState("");
      const [repos, setRepos] = useState([]);
      const [details, setDetails] = useState({});
      const [allRuns, setAllRuns] = useState([]);
      const [loading, setLoading] = useState(true);
      const [init, setInit] = useState(true);
      const [groups, setGroups] = useState({});
      const [grouped, setGrouped] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [collapsed, setCollapsed] = useState({});
      // Default sort: last action (via _lastRunDate custom field)
      const [repoSort, setRepoSort] = useState({ field: "_lastRunDate", dir: "desc" });
      const [runSort, setRunSort] = useState({ field: "created_at", dir: "desc" });
      const [triggering, setTriggering] = useState({});
      const [tab, setTab] = useState("repos");

      useEffect(() => {
        const t = loadToken();
        if (t) { ghFetch("/user", t).then(u => { setToken(t); setUser(u); }).catch(() => {}).finally(() => setInit(false)); }
        else setInit(false);
        setGroups(loadGroups());
      }, []);

      const fetchData = useCallback(async () => {
        if (!token || !user) return;
        setLoading(true);
        try {
          const allRepos = await fetchAllRepos(token);
          setRepos(allRepos);
          const det = {}, runs = [];
          for (let i = 0; i < allRepos.length; i += 5) {
            const batch = allRepos.slice(i, i + 5);
            await Promise.all(batch.map(async repo => {
              const [wf, rr] = await Promise.all([
                fetchWorkflows(user.login, repo.name, token),
                fetchRuns(user.login, repo.name, token, 5)
              ]);
              const deployWf = wf.find(w => /deploy|build/i.test(w.name));
              const dispatchWf = wf.find(w => /deploy|build/i.test(w.name) && w.state === "active");
              det[repo.name] = { workflows: wf, deployWf, dispatchWf, latestRun: rr[0] || null };
              runs.push(...rr.map(r => ({ ...r, _repo: repo.name, _full: repo.full_name })));
            }));
          }
          setDetails(det);
          setAllRuns(runs);
        } catch (e) { console.error(e); }
        setLoading(false);
      }, [token, user]);

      useEffect(() => { fetchData(); }, [fetchData]);

      // Sort with custom field support
      const doSort = (data, cfg, detailsMap) => {
        return [...data].sort((a, b) => {
          let av, bv;
          if (cfg.field === "_lastRunDate") {
            // Custom: sort by latest run date
            const da = detailsMap ? detailsMap[a.name]?.latestRun?.created_at : null;
            const db = detailsMap ? detailsMap[b.name]?.latestRun?.created_at : null;
            av = da || "";
            bv = db || "";
          } else {
            av = a[cfg.field];
            bv = b[cfg.field];
          }
          if (typeof av === "string") { av = av.toLowerCase(); bv = (bv || "").toLowerCase(); }
          if (av == null || av === "") return 1;
          if (bv == null || bv === "") return -1;
          return av < bv ? (cfg.dir === "asc" ? -1 : 1) : av > bv ? (cfg.dir === "asc" ? 1 : -1) : 0;
        });
      };
      const toggleSort = setter => field => setter(p => ({ field, dir: p.field === field && p.dir === "desc" ? "asc" : "desc" }));

      const handleTrigger = async (repo, wid) => {
        setTriggering(t => ({...t, [repo]: true}));
        try { await triggerWorkflow(user.login, repo, wid, token); setTimeout(fetchData, 3000); }
        catch (e) { alert("Fehler: " + e.message); }
        setTriggering(t => ({...t, [repo]: false}));
      };

      const handleSaveGroups = g => { setGroups(g); saveGroupsLS(g); };

      const sorted = doSort(repos, repoSort, details);
      const groupedRepos = useMemo(() => {
        if (!grouped) return { "": sorted };
        const g = {};
        sorted.forEach(r => { const k = groups[r.name] || "Ohne Gruppe"; (g[k] = g[k] || []).push(r); });
        const s = {};
        Object.keys(g).sort((a,b) => a === "Ohne Gruppe" ? 1 : b === "Ohne Gruppe" ? -1 : a.localeCompare(b)).forEach(k => s[k] = g[k]);
        return s;
      }, [sorted, grouped, groups]);

      const sortedRuns = doSort(allRuns, runSort).slice(0, 60);

      const logout = () => { clearToken(); setToken(null); setUser(null); setRepos([]); setDetails({}); setAllRuns([]); };

      if (init) return <div className="loader-wrap"><I.loader size={28} className="spin" style={{color:"var(--accent-blue)"}} /></div>;
      if (!token) return <LoginScreen onLogin={(t,u,e) => { setToken(t); setUser(u); setLoginErr(e||""); }} error={loginErr} />;

      const RepoRow = ({ repo }) => {
        const d = details[repo.name] || {};
        const langs = getLanguages(repo, details);
        return (
          <tr>
            <td style={{width:40,textAlign:"center"}}>
              {repo.private ? <LockIcon size={15} /> : <WarnTriangle size={16} />}
            </td>
            {grouped && <td style={{fontSize:12,color:"var(--text-muted)"}}>{groups[repo.name] || "—"}</td>}
            <td><a href={repo.html_url} target="_blank" style={{fontWeight:600,fontFamily:"var(--font-mono)",fontSize:13}}>{repo.name}</a></td>
            <td style={{color:"var(--text-secondary)",fontSize:12,fontFamily:"var(--font-mono)"}}>{timeAgo(repo.updated_at)}</td>
            <td>
              {d.latestRun ? (
                <a href={d.latestRun.html_url} target="_blank" className="status" style={{color:"var(--text-secondary)"}}>
                  <StatusDot status={d.latestRun.status} conclusion={d.latestRun.conclusion} />
                  <span style={{fontFamily:"var(--font-mono)",fontSize:12}}>{fmtDate(d.latestRun.created_at)}</span>
                </a>
              ) : <span style={{color:"var(--text-muted)",fontSize:12}}>—</span>}
            </td>
            <td>
              {d.deployWf ? (
                <a href={`${repo.html_url}/blob/main/${d.deployWf.path}`} target="_blank" className="deploy-link">
                  <I.file size={12} />{d.deployWf.name}
                </a>
              ) : <span style={{color:"var(--text-muted)",fontSize:12}}>—</span>}
            </td>
            <td>
              {d.dispatchWf ? (
                <button className="btn btn-deploy" onClick={() => handleTrigger(repo.name, d.dispatchWf.id)} disabled={triggering[repo.name]}>
                  {triggering[repo.name] ? <I.loader size={11} className="spin" /> : <I.play size={11} />}
                  Start
                </button>
              ) : null}
            </td>
            <td>
              {langs.length > 0 ? (
                <span style={{display:"flex",gap:4,flexWrap:"wrap"}}>{langs.map(l => <span key={l} className="badge badge-lang">{l}</span>)}</span>
              ) : <span style={{color:"var(--text-muted)",fontSize:12}}>—</span>}
            </td>
            <td style={{color:"var(--text-secondary)",fontSize:12,fontFamily:"var(--font-mono)"}}>{repo.size ? `${(repo.size/1024).toFixed(1)} MB` : "—"}</td>
          </tr>
        );
      };

      const RepoTable = ({ repos: rp }) => (
        <div className="table-wrap overflow-x">
          <table>
            <thead>
              <tr>
                <th style={{width:40}}></th>
                {grouped && <SortHeader label="Gruppe" field="_group" config={repoSort} onSort={toggleSort(setRepoSort)} />}
                <SortHeader label="Repository" field="name" config={repoSort} onSort={toggleSort(setRepoSort)} />
                <SortHeader label="Aktualisiert" field="updated_at" config={repoSort} onSort={toggleSort(setRepoSort)} />
                <SortHeader label="Letzte Action" field="_lastRunDate" config={repoSort} onSort={toggleSort(setRepoSort)} />
                <th>Deploy-Skript</th>
                <th style={{width:80}}>Deploy</th>
                <SortHeader label="Sprache" field="language" config={repoSort} onSort={toggleSort(setRepoSort)} />
                <SortHeader label="Größe" field="size" config={repoSort} onSort={toggleSort(setRepoSort)} />
              </tr>
            </thead>
            <tbody>{rp.map(r => <RepoRow key={r.id} repo={r} />)}</tbody>
          </table>
        </div>
      );

      return (
        <div>
          {showModal && <GroupModal repos={repos} groups={groups} onSave={handleSaveGroups} onClose={() => setShowModal(false)} />}

          <header className="header">
            <div className="container header-inner">
              <div className="header-left">
                <span className="header-logo"><I.gitBranch size={22} /></span>
                <span className="header-title">Dashboard</span>
                {user && <span className="header-user">@{user.login}</span>}
              </div>
              <div className="header-actions">
                <button className="btn btn-icon" onClick={fetchData} disabled={loading} title="Aktualisieren">
                  <I.refresh size={15} className={loading ? "spin" : ""} />
                </button>
                <button className="btn btn-icon" onClick={() => setShowModal(true)} title="Gruppen">
                  <I.settings size={15} />
                </button>
                <button className="btn btn-icon" onClick={logout} title="Logout">
                  <I.logout size={15} />
                </button>
              </div>
            </div>
          </header>

          <div className="container" style={{paddingTop:20}}>
            <div className="tabs">
              <button className={`tab ${tab==="repos" ? "active" : ""}`} onClick={() => setTab("repos")}>
                <I.list size={14} />Repositories<span className="tab-count">{repos.length}</span>
              </button>
              <button className={`tab ${tab==="runs" ? "active" : ""}`} onClick={() => setTab("runs")}>
                <I.play size={14} />Deployments<span className="tab-count">{allRuns.length}</span>
              </button>
            </div>

            {loading && repos.length === 0 ? (
              <div className="loader-wrap"><I.loader size={26} className="spin" style={{color:"var(--accent-blue)"}} /><span>Lade Repositories...</span></div>
            ) : tab === "repos" ? (
              <div className="fade-in">
                <div style={{marginBottom:12}}>
                  <button className={`btn btn-ghost ${grouped ? "active" : ""}`} onClick={() => setGrouped(g => !g)}>
                    <I.list size={13} />{grouped ? "Gruppiert" : "Gruppierung"}
                  </button>
                  {loading && <I.loader size={13} className="spin" style={{marginLeft:8,color:"var(--accent-blue)"}} />}
                </div>
                {Object.entries(groupedRepos).map(([name, rp]) => (
                  <div key={name}>
                    {grouped && name && (
                      <div className="group-header" onClick={() => setCollapsed(c => ({...c, [name]: !c[name]}))}>
                        {collapsed[name] ? <I.chevRight size={16} /> : <I.chevDown size={16} />}
                        {name} <span className="group-count">({rp.length})</span>
                      </div>
                    )}
                    {!collapsed[name] && <RepoTable repos={rp} />}
                  </div>
                ))}
              </div>
            ) : (
              /* Deployments Table */
              <div className="table-wrap overflow-x fade-in">
                <table>
                  <thead>
                    <tr>
                      <SortHeader label="Datum / Zeit" field="created_at" config={runSort} onSort={toggleSort(setRunSort)} />
                      <SortHeader label="Repository" field="_repo" config={runSort} onSort={toggleSort(setRunSort)} />
                      <th>Dauer</th>
                      <SortHeader label="Name" field="name" config={runSort} onSort={toggleSort(setRunSort)} />
                      <th>Commit</th>
                      <th>Pushed by</th>
                      <th style={{width:80}}>Deploy</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedRuns.map(run => {
                      // Find dispatch workflow for this repo
                      const d = details[run._repo];
                      const dispatchWf = d?.dispatchWf;
                      return (
                        <tr key={run.id}>
                          <td>
                            <a href={run.html_url} target="_blank" className="status" style={{color:"var(--text-secondary)"}}>
                              <StatusDot status={run.status} conclusion={run.conclusion} />
                              <span style={{fontFamily:"var(--font-mono)",fontSize:12}}>{fmtDate(run.created_at)}</span>
                            </a>
                          </td>
                          <td><a href={`https://github.com/${run._full}`} target="_blank" style={{fontFamily:"var(--font-mono)",fontSize:12,fontWeight:600}}>{run._repo}</a></td>
                          <td style={{fontSize:12,color:"var(--text-secondary)"}}>
                            <span className="status"><I.clock size={11} />{fmtDuration(run.run_started_at, run.updated_at)}</span>
                          </td>
                          <td>
                            <a href={run.html_url} target="_blank" style={{fontSize:12,color:"var(--text-secondary)"}}>{run.name}</a>
                          </td>
                          <td className="truncate" style={{fontSize:12,color:"var(--text-secondary)"}} title={run.head_commit?.message}>{run.head_commit?.message?.split("\n")[0] || "—"}</td>
                          <td style={{fontSize:12,color:"var(--text-secondary)",fontFamily:"var(--font-mono)"}}>{run.actor?.login || "—"}</td>
                          <td>
                            {dispatchWf ? (
                              <button className="btn btn-deploy" onClick={() => handleTrigger(run._repo, dispatchWf.id)} disabled={triggering[run._repo]}>
                                {triggering[run._repo] ? <I.loader size={11} className="spin" /> : <I.play size={11} />}
                                Start
                              </button>
                            ) : null}
                          </td>
                        </tr>
                      );
                    })}
                    {sortedRuns.length === 0 && <tr><td colSpan={7} style={{textAlign:"center",padding:40,color:"var(--text-muted)"}}>Keine Workflow Runs gefunden</td></tr>}
                  </tbody>
                </table>
              </div>
            )}

            <div className="footer">GitHub Dashboard · Token gültig bis {new Date(Date.now() + EXPIRY_DAYS*86400000).toLocaleDateString("de-DE")}</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
  </script>
</body>
</html>
